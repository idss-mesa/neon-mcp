[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neon-mcp"
dynamic = ["version"]
description = "Model Context Protocol (MCP 2026-07-28) server for the NEON Data API: discover, check availability for, list, download and cite NEON ecological data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "IDSS / MESA contributors, University of New Mexico" }]
keywords = ["mcp", "neon", "neonscience", "ecology", "data-api", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    # MCP 2026-07-28 (stateless core). SDK 2.x removed the 1.x decorator API.
    "mcp>=2.0,<3",
    "httpx>=0.28,<1",
    "pydantic>=2.7",
    "pyyaml>=6",
    "structlog>=24",
    "anyio>=4",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
pdf = ["pypdf>=4"]
docs = ["zensical>=0.0.60", "pyyaml"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "hypothesis>=6",
    "jsonschema>=4",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
neon-mcp = "neon_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/idss-mesa/neon-mcp"
Documentation = "https://idss-mesa.github.io/neon-mcp/"
Source = "https://github.com/idss-mesa/neon-mcp"
Issues = "https://github.com/idss-mesa/neon-mcp/issues"
Changelog = "https://github.com/idss-mesa/neon-mcp/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/neon_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/neon_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/neon_mcp", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "site",
    "docs",
    # vendored unchanged from UNM-CARC/docs (keep identical to upstream)
    "scripts/okf_validate.py",
    "scripts/gen_llms_txt.py",
    "scripts/postbuild_agent_surface.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]
ignore = [
    "S105",  # hardcoded-password heuristics fire on constants named *TOKEN* (header names, guide URIs)
    "S106",
    "S107",
    "RUF001",  # ambiguous unicode in strings (en dashes / arrows in prose are intentional)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.pycodestyle]
max-line-length = 120  # the formatter targets 100; long description strings may run to 120

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "S603", "B011", "RUF012"]
"scripts/**" = ["S603", "S607", "S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: hits the real NEON API (opt-in; set NEON_MCP_LIVE=1)"]
addopts = "-ra -m 'not live'"
filterwarnings = ["ignore::DeprecationWarning:hypothesis.*"]

[tool.coverage.run]
source = ["neon_mcp"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload", "\\.\\.\\."]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pypdf", "pypdf.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
